[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-kanoon-scraper"
version = "0.1.0"
description = "Interactive, respectful catalogue scraper for Indian Kanoon public pages"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.scripts]
ik-scraper = "ik_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["ik_scraper*"]
