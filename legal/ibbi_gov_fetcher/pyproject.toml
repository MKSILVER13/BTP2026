[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibbi-gov-fetcher"
version = "0.1.0"
description = "Downloader and metadata indexer for public IBBI order PDFs"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "requests>=2.31"]

[project.scripts]
ibbi-fetcher = "ibbi_gov_fetcher.cli:main"

[tool.setuptools.packages.find]
include = ["ibbi_gov_fetcher*"]
